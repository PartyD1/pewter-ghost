name: pewter-ghost

# G-01: typecheck, unit tests, build, "no key in dist", and the browser loop
# checks, on every push and pull request.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pewter-ghost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npx vitest run

      - name: Prompt bundle is up to date
        run: npx tsx prompts/build.ts --check

      # The build gets a FAKE key in VITE_LLM_API_KEY on purpose: if any code
      # path ever inlines env vars into the bundle, the scan below fails.
      # The real key is never given to the client build (it lives in the proxy).
      - name: Build
        run: npx vite build
        env:
          VITE_COMMIT: ${{ github.sha }}
          VITE_LLM_API_KEY: AIzaCANARYcanaryCANARYcanaryCANARYcan00

      - name: No key in dist
        run: |
          npx tsx proxy/src/keyScan.ts dist
          if grep -rIl -e "AIza" -e "CANARYcanary" -e "VITE_LLM_API_KEY" dist; then
            echo "::error::dist/ contains a key pattern"
            exit 1
          fi

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: pewter-ghost-dist
          path: dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Whole loop with the StubFiller: draw three steps, a verified ghost
      # appears, Tab accepts, undo restores; screenshot in the artifact.
      - name: Loop check (stub)
        run: node apps/editor/src/__e2e__/loopCheck.cjs --shot docs/screens/loop-stub.png

      - name: Ghost layer check
        run: node apps/editor/src/ghost/__e2e__/ghostCheck.cjs docs/screens/ghost.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pewter-ghost-screens
          path: docs/screens/*.png
          retention-days: 7
